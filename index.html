<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Noir Note — Minimal Workspace</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div class="app-container">
    <!-- AUTHENTICATION VIEW (Visible when not logged in) -->
    <div class="auth-wrapper" id="auth-view" style="display: none;">
      <div class="auth-card">
        <div class="auth-header">
          <div class="auth-brand-badge">NOIR WORKSPACE</div>
          <h1 class="auth-title" id="auth-main-title">Sign In</h1>
          <p class="auth-subtitle" id="auth-main-subtitle">Access your private minimalist notes</p>
        </div>

        <!-- Auth Tabs -->
        <div class="auth-tabs">
          <button type="button" class="auth-tab-btn active" id="tab-login">Sign In</button>
          <button type="button" class="auth-tab-btn" id="tab-signup">Sign Up</button>
        </div>

        <!-- Feedback / Error Banner -->
        <div class="auth-alert" id="auth-alert" style="display: none;"></div>

        <!-- Sign In Form -->
        <form class="auth-form" id="form-login">
          <div class="auth-field">
            <label class="auth-label" for="login-email">Email</label>
            <input type="email" id="login-email" class="auth-input" placeholder="name@example.com" autocomplete="email" required>
          </div>
          <div class="auth-field">
            <label class="auth-label" for="login-password">Password</label>
            <input type="password" id="login-password" class="auth-input" placeholder="Enter password" autocomplete="current-password" required>
          </div>
          <button type="submit" class="auth-submit-btn" id="btn-login-submit">Sign In</button>
        </form>

        <!-- Sign Up Form -->
        <form class="auth-form" id="form-signup" style="display: none;">
          <div class="auth-field">
            <label class="auth-label" for="signup-email">Email</label>
            <input type="email" id="signup-email" class="auth-input" placeholder="name@example.com" autocomplete="email" required>
          </div>
          <div class="auth-field">
            <label class="auth-label" for="signup-password">Password</label>
            <input type="password" id="signup-password" class="auth-input" placeholder="Create password (min. 6 chars)" autocomplete="new-password" required>
          </div>
          <div class="auth-field">
            <label class="auth-label" for="signup-confirm">Confirm Password</label>
            <input type="password" id="signup-confirm" class="auth-input" placeholder="Confirm your password" autocomplete="new-password" required>
          </div>
          <button type="submit" class="auth-submit-btn" id="btn-signup-submit">Create Account</button>
        </form>

        <div class="auth-footer-hint">
          <span id="auth-switch-prompt">Don't have an account?</span>
          <button type="button" class="auth-switch-link" id="link-switch-auth">Sign up</button>
        </div>
      </div>
    </div>

    <!-- MAIN SCROLLABLE WRAPPER -->
    <main class="editor-scroll-container" id="editor-view">
      <div class="editor-center-column">

        <!-- 1. BACK NAVIGATION (Only in child page) -->
        <div class="page-nav-back-container" id="nav-back-container" style="display: none;">
          <button class="btn-nav-back" id="btn-nav-back">
            <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor"><line x1="19" y1="12" x2="5" y2="12"/><polyline points="12 19 5 12 12 5"/></svg>
            <span id="nav-back-title">Dashboard</span>
          </button>
          <span class="breadcrumb-trail" id="breadcrumb-trail"></span>
        </div>

        <!-- 2. PAGE HEADER (TITLE) -->
        <div class="page-header-container">
          <textarea class="page-title-input" id="page-title" rows="1" placeholder="Untitled..."></textarea>
        </div>

        <!-- 3. MAIN PAGE VIEW (SUBPAGE BUTTON CARDS & ADD PAGE ZONE) -->
        <div class="main-page-wrapper" id="main-page-view" style="display: none;">
          <div class="main-subpage-grid" id="main-subpage-grid"></div>

          <!-- Add Page Zone (Reveals ONLY when hovering directly over this zone) -->
          <div class="add-subpage-zone">
            <button class="btn-add-main-subpage" id="btn-add-main-subpage">
              <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
              <span>Add Page</span>
            </button>
          </div>
        </div>

        <!-- 4. SUBPAGE DOCUMENT VIEW (CELLS & 2-COLUMN BLOCKS) -->
        <div class="subpage-doc-wrapper" id="subpage-doc-view">
          <div class="cells-container" id="cells-container"></div>

          <!-- Bottom Add Cell Bar (Hover-reveal) -->
          <div class="bottom-bar-zone">
            <div class="bottom-add-cell-bar">
              <button class="add-cell-btn" data-type="columns" title="2-column side-by-side split">
                <span>+ 2 Columns</span>
              </button>
              <button class="add-cell-btn" data-type="markdown">
                <span>+ Markdown</span>
              </button>
              <button class="add-cell-btn" data-type="code">
                <span>+ Code</span>
              </button>
              <button class="add-cell-btn" data-type="checklist">
                <span>+ Tasks</span>
              </button>
              <button class="add-cell-btn" data-type="callout">
                <span>+ Note</span>
              </button>
              <button class="add-cell-btn" data-type="toggle">
                <span>+ Toggle</span>
              </button>
              <button class="add-cell-btn" data-type="subpage">
                <span>+ Subpage</span>
              </button>
            </div>
          </div>
        </div>

        <!-- 5. FOOTER MENU (MD EXPORT, BACKUP, RESTORE, SIGN OUT) -->
        <div class="footer-hover-zone">
          <footer class="page-bottom-footer">
            <div class="footer-left-info" id="footer-page-info">Noir Note</div>
            <div class="footer-actions">
              <span class="footer-sync-tag" id="footer-sync-tag" title="Cloud Database Connection Status">Cloud Synced</span>
              <span class="footer-user-tag" id="footer-user-name"></span>
              <button class="btn-footer" id="btn-export-md" title="Download current page as Markdown">Export MD</button>
              <button class="btn-footer" id="btn-backup-json" title="Backup all data to JSON">Backup</button>
              <button class="btn-footer" id="btn-restore-json-trigger" title="Restore data from JSON">Restore</button>
              <button class="btn-footer btn-footer-signout" id="btn-sign-out" title="Sign out of account">Sign Out</button>
            </div>
          </footer>
        </div>
        <input type="file" id="input-restore-file" accept=".json" style="display: none;" />

      </div>
    </main>
  </div>

  <!-- QUICK INSERT CELL MODAL -->
  <div class="modal-overlay" id="insert-modal">
    <div class="modal-content">
      <div class="modal-header">
        <h3 class="modal-title">Insert Block</h3>
        <button class="cell-btn" id="btn-close-insert-modal" style="font-size: 20px;">&times;</button>
      </div>
      <div class="modal-list">
        <button class="modal-item-btn" data-insert-type="columns">
          <span>2 Columns (Side-by-side independent blocks)</span>
        </button>
        <button class="modal-item-btn" data-insert-type="markdown">
          <span>Markdown (Text, headers, lists, quotes)</span>
        </button>
        <button class="modal-item-btn" data-insert-type="code">
          <span>Code Block (Syntax highlighting & copy)</span>
        </button>
        <button class="modal-item-btn" data-insert-type="checklist">
          <span>Tasks (Goals & todo checklist)</span>
        </button>
        <button class="modal-item-btn" data-insert-type="callout">
          <span>Note (Key takeaway & callout)</span>
        </button>
        <button class="modal-item-btn" data-insert-type="toggle">
          <span>Toggle (Q&A & self-testing)</span>
        </button>
        <button class="modal-item-btn" data-insert-type="subpage">
          <span>Subpage (Nested child page card)</span>
        </button>
      </div>
    </div>
  </div>

  <!-- TOAST NOTIFICATION CONTAINER -->
  <div class="toast-container" id="toast-container"></div>

  <!-- SCRIPTS -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/supabase.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/markdown.js"></script>
  <script src="js/storage.js"></script>
  <script src="js/cells.js"></script>
  <script src="js/pages.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
